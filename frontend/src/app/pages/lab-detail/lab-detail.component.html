<div class="az-content">
  <div class="container">
    <div class="az-content-body">

      <report-header [reportHeaderTitle]="observationTitle ? 'Labs: ' + observationTitle : 'Labs: ' + observationCode"
        [reportHeaderSubTitle]="'The Labs report turns data into meaningful information'"></report-header>

      <div *ngIf="observationCode" class="card card-dashboard-seven glossary-card">
        <div class="pt-3 px-3 pb-0">
          <app-glossary-lookup [code]="observationCode" [codeSystem]="'http://loinc.org'"></app-glossary-lookup>
        </div>
      </div>

      <ng-container
        [ngTemplateOutlet]="loading ? isLoadingTemplate : isEmptyReport ? emptyReport : report"></ng-container>

      <ng-template #report>
        <app-report-labs-observation [observations]="observations" [observationTitle]="observationTitle"
          [observationCode]="observationCode"></app-report-labs-observation>
      </ng-template>

      <ng-template #isLoadingTemplate>
        <div class="row">
          <div class="col-12">
            <app-loading-spinner [loadingTitle]="'Please wait, loading report...'"></app-loading-spinner>
          </div>
        </div>
      </ng-template>

      <ng-template #emptyReport>
        <div class="d-flex align-items-center" style="height:100%">
          <div class="modal-body tx-center pd-y-20 pd-x-20">
            <h4 class="tx-purple mg-b-20">No Lab Data Found!</h4>
            <p class="mg-b-20 mg-x-20">
              Fasten was unable to find any lab data from your connected sources. You may need to connect another source
              to import your Lab data.
            </p>
            <p class="mg-b-20 mg-x-20">
              Click below to add a new healthcare provider to Fasten.
            </p>
            <button [routerLink]="'/sources'" type="button" class="btn btn-purple pd-x-25">Add Source</button>
            <button [routerLink]="'/resource/create'" type="button" class="btn btn-purple pd-x-25 mg-l-10">Add
              Condition</button>

          </div><!-- modal-body -->
        </div>
      </ng-template>

    </div>
  </div>
</div>
